<div class="content-container">

<div class="header-container">
  <h1>Список студентов</h1>

  <mat-form-field appearance="standard">
    <mat-label>Фильтр по имени</mat-label>
    <input matInput placeholder="Кого надо" #filterInput>
  </mat-form-field>
</div>

<div class="table-container mat-elevation-z8">

  <div class="loading-shade" *ngIf="isLoadingResults">
    <mat-spinner></mat-spinner>
  </div>

  <table mat-table [dataSource]="dataSource" matSort>

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let student">{{student.id}}</td>
    </ng-container>

   <ng-container matColumnDef="fio">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ФИО</th>
        <td mat-cell *matCellDef="let student">{{ student.fio }}</td>
      </ng-container>

      <ng-container matColumnDef="group">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Группа</th>
        <td mat-cell *matCellDef="let student">{{ student.group?.name }}</td>
      </ng-container>

      <ng-container matColumnDef="phoneNumber">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Номер телефона</th>
        <td mat-cell *matCellDef="let student">{{ student.phoneNumber }}</td>
      </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Действия</th>
      <td mat-cell *matCellDef="let student">
        <button mat-raised-button color="primary" (click)="updateStudent(student)" style="margin-right: 8px;">Редактировать</button>
        <button mat-raised-button color="warn" (click)="deleteStudent(student)">Удалить</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="5">По вашему запросу ничего не найдено.</td>
    </tr>
  </table>

  <mat-paginator [length]="resultsLength" [pageSize]="5"
                 [pageSizeOptions]="[5, 10, 20]"
                 showFirstLastButtons>
  </mat-paginator>

</div>

<br>
<button mat-raised-button color="primary" (click)="addNewStudent()">Добавить студента</button>

</div>
